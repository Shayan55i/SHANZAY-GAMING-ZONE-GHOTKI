<section class="booking-center">

    <h2>🎮 BOOKING CENTER</h2>

    <p>
        Reserve your PlayStation or Gaming PC in advance.
        Choose your preferred console and time slot.
    </p>

<section class="booking-center">

    <script src="js/script.js"></script>

<section class="booking-form">

    <h2>📅 BOOK YOUR GAMING SESSION</h2>

    <div class="booking-box">

        <input type="text" id="name" placeholder="👤 Full Name">

        <input type="tel" id="phone" placeholder="📱 WhatsApp Number">

        <select id="console">
            <option value="">🎮 Select Console</option>
            <option>PlayStation 5</option>
            <option>PlayStation 4</option>
        </select>

        <input type="date" id="date">

        <select id="time">
            <option value="">🕒 Select Time Slot</option>
            <option>10:00 AM - 11:00 AM</option>
            <option>11:00 AM - 12:00 PM</option>
            <option>12:00 PM - 01:00 PM</option>
            <option>01:00 PM - 02:00 PM</option>
            <option>02:00 PM - 03:00 PM</option>
            <option>03:00 PM - 04:00 PM</option>
            <option>04:00 PM - 05:00 PM</option>
            <option>05:00 PM - 06:00 PM</option>
            <option>06:00 PM - 07:00 PM</option>
            <option>07:00 PM - 08:00 PM</option>
            <option>08:00 PM - 09:00 PM</option>
            <option>09:00 PM - 10:00 PM</option>
        </select>

        <select id="hours">
            <option value="">⏳ Hours</option>
            <option>1 Hour</option>
            <option>2 Hours</option>
            <option>3 Hours</option>
            <option>4 Hours</option>
            <option>5 Hours</option>
        </select>

        <select id="players">
            <option value="">👥 Players</option>
            <option>1 Player</option>
            <option>2 Players</option>
        </select>

        <button type="button" onclick="sendBooking()" class="book-btn">
        📲 BOOK ON WHATSAPP
        </button>

    </div>

</section>
